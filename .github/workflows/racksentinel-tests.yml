name: RackSentinel tests

on:
  pull_request:
    paths:
      - "jetson/racksentinel/**"
      - ".github/workflows/racksentinel-tests.yml"
  push:
    branches: [main]
    paths:
      - "jetson/racksentinel/**"
      - ".github/workflows/racksentinel-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: jetson/racksentinel
        run: python -m pip install --no-deps .
      - name: Test
        working-directory: jetson/racksentinel
        run: python -m unittest discover -s tests -v
